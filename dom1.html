<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Exercise</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <div 
        class="flex flex-col gap-10 w-fit py-8 px-4 border border-black/30 rounded-3xl shadow-lg mx-auto mt-8" 
        id="multiplier-wrapper"
    >
        <div class="flex flex-col gap-2">
            <label 
                for="user-input"
                class="font-bold text-xl"
            >
                Enter a number
            </label>
            <input 
                type="number" 
                id="user-input"
                class="border px-2 h-10 rounded"
            >
        </div>

        <div 
            class="flex gap-4"
            id="action-btn-wrapper"
        >
            <button 
                id="multiply-btn"
                class="bg-yellow-200 cursor-pointer"
            >
                Multiply by 5
            </button>
            <button 
                id="clear-btn"
                class="bg-yellow-200 cursor-pointer"
            >
                Clear Output
            </button>
        </div>

        <div class="flex flex-col gap-3">
            <span>Output</span>
            <span id="output" class="w-full h-20 border flex justify-center items-center font-bold text-4xl"></span>
        </div>
    </div>
    
    <!-- <script src="dom1.js"></script> -->
    <script src="dom1-delegate.js"></script>
</body>
</html>
