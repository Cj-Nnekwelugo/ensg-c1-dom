<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Service Integration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

    <form 
        id="contact-form"
        class="border border-black/10 py-12 px-6 rounded-3xl shadow-lg m-4 w-full max-w-2xl flex flex-col gap-8 mx-auto"
    >
    <input type="hidden" name="access_key" value="1dc33d87-80aa-4f5e-b54b-056497f62f55">
        <div class="flex gap-4 w-full">
            <div class="w-1/2 flex flex-col gap-2">
                <input 
                    type="text" 
                    placeholder="Enter your first name" 
                    id="firstname"
                    name="firstname"
                    class="h-10 border border-black/30 px-3 text-sm placeholder:text-sm rounded w-full"
                    required
                >
                <p id="fn-error" class="text-xs text-red-500"></p>
            </div>

            <div class="w-1/2 flex flex-col gap-2">
                <input 
                    type="text" 
                    placeholder="Enter your last name" 
                    id="lastname"
                    name="lastname"
                    class="h-10 border border-black/30 px-3 text-sm placeholder:text-sm rounded w-full"
                    required
                >
                <p id="ln-error" class="text-xs text-red-500"></p>
            </div>
        </div>

        <div>
            <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="Enter your email"
                class="h-10 border border-black/30 px-3 text-sm placeholder:text-sm rounded w-full"
                required
            >
            <p id="email-error" class="text-xs text-red-500"></p>
        </div>

        <button 
            type="submit"
            class="bg-yellow-400 font-semibold text-lg py-3 px-10 rounded-3xl hover:bg-blue-500 hover:text-white active:translate-y-2 cursor-pointer transition-colors duration-200"
        >
            Submit
        </button>
    </form>
    
    <script src="form2.js"></script>
    <!-- <script src="form.js"></script> -->
</body>
</html>
